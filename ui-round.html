<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>本轮改动 UI 验证</title>
<style>body{background:#0d1017;color:#dfe6f2;font-family:ui-monospace,Consolas,monospace;padding:12px}
pre{white-space:pre-wrap;font-size:13px;line-height:1.55}
iframe{width:1100px;height:400px;border:1px solid #26304a;border-radius:10px;margin-top:8px}</style>
</head>
<body>
<pre id="out">运行中…</pre>
<iframe id="fr" src="/index.html"></iframe>
<script>
const lines=[]; const say=(s,c)=>{ lines.push(c?`[${c}] `+s:s); document.getElementById('out').textContent=lines.join('\n'); };
const wait=ms=>new Promise(r=>setTimeout(r,ms));
(async ()=>{
  let bad=0;
  try{
    const fr=document.getElementById('fr');
    await new Promise(r=>{ fr.onload=r; setTimeout(r,5000); });
    await wait(400);
    const W=fr.contentWindow, D=fr.contentDocument, MC=W.MCGame;
    const qa=s=>Array.from(D.querySelectorAll(s));
    const ev=c=>W.eval(c);

    say('【1】主菜单：联机入口应已移除');
    const menuBtns = qa('#screen-main .mbtn').map(b=>b.textContent.trim());
    say(`  菜单项 ${menuBtns.length} 个：${menuBtns.join(' / ')}`, menuBtns.length===3?'ok':'bad');
    if(menuBtns.length!==3) bad++;
    const hasNet = menuBtns.some(x=>x.includes('联机'));
    say(`  仍有联机入口: ${hasNet}`, !hasNet?'ok':'bad');
    if(hasNet) bad++;

    say('');
    say('【2】进程独立按钮 + 行动面板分组');
    ev(`MCGame.__api.setAutoPlayer(null); MCGame.start({enemyCount:1,diff:'normal',auto:false,mode:'1v1',silent:true,name:'UI测试'});`);
    await wait(250);
    ev(`(function(){ const p=MCGame.state().players[0]; p.ap=3; p.prog=1; p.progPts=1;
        MCGame.__api.askHuman(p, MCGame.__api.buildHumanOptions(p)).catch(()=>{}); })()`);
    await wait(300);
    const progBtn = qa('#actionbar .btn.prog')[0];
    say(`  独立进程按钮: ${progBtn? '"'+progBtn.textContent.trim().slice(0,44)+'"' : '(无)'}`, progBtn?'ok':'bad');
    if(!progBtn) bad++;
    const groups = qa('#actionbar .grouphead').map(e=>e.textContent.trim().split(' ')[0]);
    say(`  行动分组: ${groups.join(' / ')}`, groups.length>=3?'ok':'bad');
    if(groups.length<3) bad++;

    say('');
    say('【3】护甲优先级选项（持有 2 件时出现）');
    const armorInfo = ev(`(function(){
      const A=MCGame.__api, p=MCGame.state().players[0];
      A.gainArmor(p,'leather'); A.gainArmor(p,'iron_armor');
      const opts=A.buildHumanOptions(p).filter(o=>o.type==='armor_priority');
      return { armors: A.armorsOf(p).map(a=>a.key+':'+a.charges), opts: opts.map(o=>o.label) };
    })()`);
    say(`  身上护甲: ${armorInfo.armors.join(', ')}`, armorInfo.armors.length===2?'ok':'bad');
    say(`  优先级选项 ${armorInfo.opts.length} 个: ${armorInfo.opts.join(' | ')}`, armorInfo.opts.length>=1?'ok':'bad');
    if(armorInfo.opts.length<1) bad++;

    say('');
    say('【4】猜拳闪避询问框（平局时应出现两个按钮）');
    const dodgeHtml = ev(`(function(){
      const A=MCGame.__api, G=MCGame.state(), me=G.players[0], foe=G.players[1];
      me.ap=3;
      /* 直接触发询问框，检查按钮 */
      A.askDodge(me, foe);
      const btns=Array.from(document.querySelectorAll('#actionbar button')).map(b=>b.textContent.trim());
      return btns;
    })()`);
    say(`  闪避询问按钮: ${dodgeHtml.join(' | ')}`, dodgeHtml.length===2?'ok':'bad');
    if(dodgeHtml.length!==2) bad++;

    say('');
    if(bad===0) say('✅ 本轮改动界面全部正常', 'ok');
    else say(`❌ 有 ${bad} 项不符`, 'bad');
  }catch(e){ say('异常: '+(e&&e.stack?e.stack:e), 'bad'); }
  document.title='UI-ROUND-DONE';
})();
</script>
</body>
</html>
