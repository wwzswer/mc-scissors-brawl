<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>判定平局卡死 · 复现与追踪</title>
<style>body{background:#0d1017;color:#dfe6f2;font-family:ui-monospace,Consolas,monospace;padding:12px}
pre{white-space:pre-wrap;font-size:12.5px;line-height:1.5}
iframe{width:1100px;height:340px;border:1px solid #26304a;border-radius:10px;margin-top:8px}</style>
</head>
<body>
<pre id="out">运行中…</pre>
<iframe id="fr" src="/index.html"></iframe>
<script>
const lines=[]; const say=(s,c)=>{ lines.push(c?`[${c}] `+s:s); document.getElementById('out').textContent=lines.join('\n'); };
const wait=ms=>new Promise(r=>setTimeout(r,ms));
(async ()=>{
  let bad=0;
  try{
    const fr=document.getElementById('fr');
    await new Promise(r=>{ fr.onload=r; setTimeout(r,5000); });
    await wait(400);
    const W=fr.contentWindow, D=fr.contentDocument, MC=W.MCGame;
    const qa=s=>Array.from(D.querySelectorAll(s));
    const ev=c=>W.eval(c);

    /* 让“我”成为被攻击方，从而走到 askDodge 分支 */
    say('【1】构造：敌人用打火石打我，首轮必定平局');
    MC.__api.setAutoPlayer(null);
    MC.start({enemyCount:1, diff:'normal', auto:false, mode:'1v1', silent:true, name:'判定测试'});
    await wait(250);
    const G = MC.state(), me = G.players[0], foe = G.players[1];
    me.ap = 3; me.hp = 4;
    MC.__api.setDistance(me, foe, 0);
    /* 记录判定流程日志 */
    ev('globalThis.__rpsLog = []');
    /* 异步发起攻击：目标是“我”，所以会问我要不要闪避 */
    ev(`MCGame.__api.performAttack(MCGame.state().players[1], MCGame.state().players[0], 'flint', {a:'rock', b:'rock'}).then(r=>{ globalThis.__judgeResult = r; }).catch(e=>{ globalThis.__judgeErr = String(e); })`);
    await wait(600);

    say('');
    say('【2】此时应出现闪避选择框');
    const btns = qa('#actionbar button').map(b=>b.textContent.trim());
    say(`  面板按钮: ${btns.join(' | ')||'(无)'}`, btns.some(x=>x.includes('赌一把'))?'ok':'bad');
    if(!btns.some(x=>x.includes('赌一把'))) bad++;
    const log1 = ev('JSON.stringify(globalThis.__rpsLog||[])');
    say(`  判定日志: ${log1}`);

    say('');
    say('【3】点击「不消耗 AP，继续判定（赌一把）」');
    const gamble = qa('#actionbar button').find(b=>b.textContent.includes('赌一把'));
    if(gamble){
      gamble.click();
      await wait(2500);
      const state = ev(`(function(){
        const G=MCGame.state();
        return { done: globalThis.__judgeResult!==undefined, result: globalThis.__judgeResult,
                 err: globalThis.__judgeErr||null,
                 trace: (globalThis.__rpsLog||[]).slice(-14),
                 bar: Array.from(document.querySelectorAll('#actionbar button')).map(x=>x.textContent.trim().slice(0,18)),
                 meHp: G.players[0].hp, meAp: G.players[0].ap };
      })()`);
      say(`  判定是否结束: ${state.done}（结果=${state.result}）`, state.done?'ok':'bad');
      if(!state.done) bad++;
      say(`  我的状态: HP=${state.meHp} AP=${state.meAp}`);
      say(`  行动面板: ${state.bar.join(' | ')||'(空)'}`, state.bar.length?'ok':'bad');
      if(!state.bar.length) bad++;
      say('  --- 判定流程日志 ---');
      (state.trace||[]).forEach((l,i)=>say('    '+(i+1)+'. '+l));
      if(state.err) say('  异常: '+state.err, 'bad');
    } else { say('  找不到「赌一把」按钮', 'bad'); bad++; }

    say('');
    if(bad===0) say('✅ 判定平局后流程正常，未卡死', 'ok');
    else say(`❌ 有 ${bad} 项异常`, 'bad');
  }catch(e){ say('异常: '+(e&&e.stack?e.stack:e), 'bad'); }
  document.title='JUDGE-DONE';
})();
</script>
</body>
</html>
