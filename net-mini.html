<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>联机轮询最小验证</title>
<style>body{background:#0d1017;color:#dfe6f2;font-family:ui-monospace,Consolas,monospace;padding:12px}
pre{white-space:pre-wrap;font-size:13px}</style></head>
<body>
<pre id="out">运行中…</pre>
<script>
const lines=[];
const say=(s,c)=>{ lines.push((c?`[${c}] `:'')+s); document.getElementById('out').textContent=lines.join('\n'); };
const wait=ms=>new Promise(r=>setTimeout(r,ms));
(async ()=>{
  const B = location.origin;
  const api=(p,body)=>fetch(B+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})}).then(r=>r.json());
  const get=p=>fetch(B+p).then(r=>r.json());
  try{
    say('1. 创建房间');
    const a = await api('/api/create',{name:'房主A',mode:'1v1',apPerWin:2});
    say(`   code=${a.code} ok=${a.ok}`, a.ok?'ok':'bad');
    say(`   初始座位数 ${a.room.seats.length}`, a.room.seats.length===1?'ok':'bad');

    say('2. 第二个客户端加入');
    const b = await api(`/api/room/${a.code}/join`,{name:'加入者B'});
    say(`   ok=${b.ok} id=${b.youId!=null}`, b.ok?'ok':'bad');

    say('3. 房主端模拟轮询（每 600ms 拉 events）');
    let seats = 0, seq = 0, polls = 0, started = false;
    for(let i=0;i<8;i++){
      await wait(600); polls++;
      const d = await get(`/api/room/${a.code}/events?id=${a.youId}&since=${seq}`);
      if(d && d.ok){ seats = d.seats.length; seq = Math.max(seq, d.seq||0); started = !!d.started; }
      if(i===0 || seats===2) say(`   第 ${polls} 次轮询：座位 ${seats} seq=${seq}`, seats===2?'ok':undefined);
      if(seats===2) break;
    }
    say(`房主端最终看到座位数 ${seats}`, seats===2?'ok':'bad');

    say('4. 双方准备 + 开始');
    await api(`/api/room/${a.code}/ready`,{id:a.youId,ready:true});
    await api(`/api/room/${a.code}/ready`,{id:b.youId,ready:true});
    await wait(700);
    const d1 = await get(`/api/room/${a.code}/events?id=${a.youId}&since=0`);
    say(`   准备人数 ${d1.seats.filter(s=>s.ready).length}`, d1.seats.filter(s=>s.ready).length===2?'ok':'bad');
    const st = await api(`/api/room/${a.code}/start`,{id:a.youId});
    say(`   开始 ok=${st.ok}`, st.ok?'ok':'bad');

    say('5. 出拳广播（A 出石头，B 出剪刀）');
    await api(`/api/room/${a.code}/action`,{id:a.youId,action:{kind:'rps',move:'rock'}});
    await api(`/api/room/${a.code}/action`,{id:b.youId,action:{kind:'rps',move:'scissors'}});
    await wait(700);
    const dA = await get(`/api/room/${a.code}/events?id=${a.youId}&since=0`);
    const moves = dA.events.filter(e=>e.action&&e.action.kind==='rps').map(e=>e.action.move).sort();
    say(`   服务端记录出拳 ${JSON.stringify(moves)}`, moves.join(',')==='rock,scissors'?'ok':'bad');
    const dB = await get(`/api/room/${a.code}/events?id=${b.youId}&since=0`);
    const gotRps = dB.events.filter(e=>e.action&&e.action.kind==='rps'&&e.actor===a.youId).length;
    say(`   B 能拉到 A 的猜拳事件 ${gotRps} 条`, gotRps===1?'ok':'bad');
    say(`   started=${dA.started}`, dA.started?'ok':'bad');

    say('');
    say('最小验证完成', 'ok');
  }catch(e){ say('异常: '+(e&&e.stack?e.stack:e),'bad'); }
  document.title='NETMINI-DONE';
})();
</script>
</body>
</html>
