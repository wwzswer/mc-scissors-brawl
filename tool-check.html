<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>切换工具 / 攻击选项 专项验证</title>
<style>body{background:#0d1017;color:#dfe6f2;font-family:ui-monospace,Consolas,monospace;padding:12px}
pre{white-space:pre-wrap;font-size:13px}</style></head>
<body>
<pre id="out">运行中…</pre>
<iframe id="fr" src="/index.html" style="width:1100px;height:600px;border:1px solid #26304a;border-radius:10px;margin-top:10px"></iframe>
<script>
const lines=[]; const say=(s,c)=>{ lines.push(c?`[${c}] `+s:s); document.getElementById('out').textContent=lines.join('\n'); };
const wait=ms=>new Promise(r=>setTimeout(r,ms));
(async ()=>{
  try{
    const fr=document.getElementById('fr');
    await new Promise(r=>{ fr.onload=r; setTimeout(r,5000); });
    await wait(400);
    const W=fr.contentWindow, MC=W.MCGame;
    if(!MC) throw new Error('MCGame 未导出');

    /* 在 iframe 自己的 realm 里跑（避免跨 realm 干扰） */
    const run = code => W.eval(code);

    say('【准备】开一局静默 1v1');
    run("MCGame.__api.setFastTiming(); MCGame.__api.setInstantRps && MCGame.__api.setInstantRps();");
    run("MCGame.start({enemyCount:1, diff:'normal', auto:false, mode:'1v1', silent:true, name:'工具测试'});");
    await wait(200);
    const info0 = run("(function(){ const G=MCGame.state(); return {n:G.players.length, names:G.players.map(p=>p.name).join(',')}; })()");
    say(`  玩家 ${info0.n} 名：${info0.names}`, info0.n===2?'ok':'bad');

    say('');
    say('【1】把石头剑/木剑塞进背包');
    const r1 = run(`(function(){
      const A = MCGame.__api, G = MCGame.state(), p = G.players[0];
      p.prog = 3; p.itemPts = {}; p.ap = 20; p.weapon = 'fist';
      A.addItem(p,'wood_sword',1); A.addItem(p,'stone_sword',1);
      const sw = A.buildHumanOptions(p).filter(o=>o.type==='switch_weapon');
      return { weapons: A.heldWeapons(p).join(','), sw: sw.map(o=>o.key).join(','), weapon: p.weapon };
    })()`);
    say(`  持有可能：${r1.weapons}`, r1.weapons.includes('stone_sword')?'ok':'bad');
    say(`  可换上：${r1.sw}`, r1.sw.includes('stone_sword')?'ok':'bad');

    say('');
    say('【2】切换到石头剑');
    const r2 = run(`(function(){
      const A = MCGame.__api, G = MCGame.state(), p = G.players[0];
      A.switchWeapon(p, 'stone_sword');
      return { weapon: p.weapon };
    })()`);
    say(`  切换后 weapon=${r2.weapon}`, r2.weapon==='stone_sword'?'ok':'bad');

    say('');
    say('【3】把距离拉到 0，检查攻击选项');
    const r3 = run(`(function(){
      const A = MCGame.__api, G = MCGame.state(), p = G.players[0], foe = G.players[1];
      A.setDistance(p, foe, 0);
      const opts = A.buildHumanOptions(p);
      const atk = opts.filter(o=>o.type==='attack');
      return { weapon: p.weapon, dist: A.distanceBetween(p,foe),
               inRange: A.inRangeOf(p, p.weapon, foe),
               atk: atk.map(o=>o.type+':'+o.key).join(','),
               allTypes: opts.map(o=>o.type).join(',') };
    })()`);
    say(`  weapon=${r3.weapon} dist=${r3.dist} inRange=${r3.inRange}`);
    say(`  攻击选项：${r3.atk||'(无)'}`, r3.atk.includes('stone_sword')?'ok':'bad');
    say(`  全部选项类型：${r3.allTypes.slice(0,140)}`);

    say('');
    say('【4】切换回空手再切回石头剑（连续切换）');
    const r4 = run(`(function(){
      const A = MCGame.__api, G = MCGame.state(), p = G.players[0], foe = G.players[1];
      A.switchWeapon(p,'fist');
      const a1 = A.buildHumanOptions(p).filter(o=>o.type==='attack').map(o=>o.key).join(',');
      A.switchWeapon(p,'wood_sword');
      const a2 = A.buildHumanOptions(p).filter(o=>o.type==='attack').map(o=>o.key).join(',');
      A.switchWeapon(p,'stone_sword');
      const a3 = A.buildHumanOptions(p).filter(o=>o.type==='attack').map(o=>o.key).join(',');
      return { fist:a1, wood:a2, stone:a3, weapon:p.weapon };
    })()`);
    say(`  空手攻击=${r4.fist}｜木剑=${r4.wood}｜石剑=${r4.stone}`, r4.stone==='stone_sword'?'ok':'bad');

    say('');
    say('【5】距离 1 格时应无近战攻击、但有靠近选项');
    const r5 = run(`(function(){
      const A = MCGame.__api, G = MCGame.state(), p = G.players[0], foe = G.players[1];
      A.setDistance(p, foe, 1);
      const opts = A.buildHumanOptions(p);
      return { atk: opts.filter(o=>o.type==='attack').length,
               move: opts.filter(o=>o.type==='move'&&o.dir===-1).length };
    })()`);
    say(`  距离 1：攻击 ${r5.atk} 个、靠近 ${r5.move} 个`, r5.atk===0 && r5.move===1?'ok':'bad');

    say('');
    say('专项验证完成', 'ok');
  }catch(e){ say('异常: '+(e&&e.stack?e.stack:e), 'bad'); }
  document.title='TOOL-DONE';
})();
</script>
</body>
</html>
