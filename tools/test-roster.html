<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>roster-test</title>
<style>body{background:#0b0f14;color:#e8ecf5;font:13px/1.7 Consolas,monospace;padding:14px}
.ok{color:#6ee7a8}.bad{color:#ff7b7b}pre{white-space:pre-wrap}</style></head>
<body>
<pre id="results">running…</pre>
<iframe id="f" src="/index.html" style="width:900px;height:600px;border:1px solid #333"></iframe>
<script>
const out = [];
let fails = 0;
function log(ok, msg, extra){
  if(ok === null) out.push('… ' + msg);
  else { if(!ok) fails++; out.push((ok ? '✔ ' : '✘ ') + msg + (extra ? '  ' + JSON.stringify(extra) : '')); }
  document.getElementById('results').textContent = out.join('\n');
}
const sleep = ms => new Promise(r=>setTimeout(r,ms));
function finish(){
  out.push('');
  out.push(fails === 0 ? 'ALL PASS' : ('FAILURES: ' + fails));
  document.getElementById('results').textContent = out.join('\n');
  document.title = fails === 0 ? 'ALL-PASS' : ('FAIL-' + fails);
}
window.addEventListener('load', ()=>{
  const f = document.getElementById('f');
  const ready = ()=> new Promise(res => {
    const w = f.contentWindow;
    const t = setInterval(()=>{ if(w && w.MCGame){ clearInterval(t); res(w.MCGame); } }, 50);
    setTimeout(()=>{ clearInterval(t); res(null); }, 8000);
  });
  ready().then(async MCG=>{
    try{
      if(!MCG){ log(false, 'MCGame 未就绪'); finish(); return; }
      log(true, '页面加载，MCGame 就绪');

      /* ---------- 1. 默认名单 ---------- */
      const def = MCG.roster;
      log(Array.isArray(def) && def.length === 2, '默认名单 2 人（1v1 / 1 敌）', def);
      log(def.filter(x=>x.human).length === 1, '默认名单恰好 1 名玩家');
      log(new Set(def.map(x=>x.team)).size === 2, '默认名单 2 个队伍');

      /* ---------- 2. 自定义名单 + 每人独立强度 ---------- */
      MCG.setRoster([
        {name:'小明', human:true,  team:0},
        {name:'菜鸟', human:false, team:1, diff:'easy'},
        {name:'大佬', human:false, team:1, diff:'hard'},
      ]);
      MCG.start({silent:true, seed:4242});
      let G = MCG.state();
      log(G.players.length === 3, '3 人名单开局', G.players.map(p=>p.name));
      log(G.players[1].diff === 'easy' && G.players[2].diff === 'hard', '每个机器人强度独立生效',
          G.players.map(p=>p.name+':'+(p.diff||'-')));
      log(G.players[1].isEnemy === true && G.players[2].isEnemy === true, '异队 = 敌方');
      log(G.players[0].team === 0 && G.players[1].team === 1, '队伍号正确');

      /* ---------- 3. 队友（同队）判定 + 不对等人数 ---------- */
      MCG.setRoster([
        {name:'我', human:true,  team:0},
        {name:'队友', human:false, team:0, diff:'normal'},
        {name:'敌人1', human:false, team:1, diff:'hard'},
        {name:'敌人2', human:false, team:1, diff:'hard'},
        {name:'敌人3', human:false, team:1, diff:'hard'},
      ]);
      MCG.start({silent:true, seed:99});
      G = MCG.state();
      log(G.players.length === 5, '5 人开局（1+1 队友 vs 3 敌）');
      log(G.players.filter(p=>p.isEnemy).length === 3, '敌方 3 人（不对等人数允许）');
      log(G.players[1].isEnemy === false && G.players[1].team === 0, '同队机器人 = 队友');

      /* ---------- 4. 归一化修复 ---------- */
      let r = MCG.setRoster([{name:'孤家', human:true, team:0}]);
      log(r.length === 2 && new Set(r.map(x=>x.team)).size === 2, '只有 1 人 → 自动补 1 个敌对机器人', r);
      r = MCG.setRoster([{name:'甲', human:true, team:0}, {name:'乙', human:false, team:0}]);
      log(r.length === 2 && new Set(r.map(x=>x.team)).size >= 2, '全员同队 → 自动分出敌人', r);
      r = MCG.setRoster([{name:'A', human:true, team:0}, {name:'B', human:true, team:1}]);
      log(r.filter(x=>x.human).length === 1, '写了 2 个玩家 → 只保留 1 个', r);
      r = MCG.setRoster(Array.from({length:9}, (_,i)=>({name:'P'+i, human:i===0, team:i%2})));
      log(r.length === 6, '超过 6 人 → 截断到 6', r.length);

      /* ---------- 5. 三方混战 ---------- */
      MCG.preset3Way();
      MCG.start({silent:true, seed:7});
      G = MCG.state();
      log(new Set(G.players.map(p=>p.team)).size === 3, '三方混战：3 个队伍', G.players.map(p=>p.team));
      log(G.players.filter(p=>p.isEnemy).length === 2, '三方混战：除自己外都是敌人');

      /* ---------- 6. 队友阵亡 / 敌方全灭的胜负判定 ---------- */
      MCG.setRoster([
        {name:'我', human:true, team:0},
        {name:'队友', human:false, team:0},
        {name:'敌人', human:false, team:1},
      ]);
      MCG.start({silent:true, seed:11});
      G = MCG.state();
      const enemy = G.players.find(p=>p.isEnemy);
      try{ MCG.__api.killPlayer(enemy); }catch(e){ log(false, 'killPlayer 抛错: ' + e.message); }
      G = MCG.state();
      log(G.over === true, '敌方全灭 → 对局结束（判定走 checkGameEnd）', {over:G.over});

      /* ---------- 7. 完整跑一局（快速 + 自动玩家） ---------- */
      MCG.__api.setFastTiming();
      MCG.__api.setInstantRps();
      MCG.__api.setSeed(2024);
      MCG.__api.setAutoPlayer((p, opts)=>{
        const o = opts || [];
        return o.find(x=>x.type==='attack') || o.find(x=>x.type==='shop_progress')
            || o.find(x=>x.type==='craftShopItem') || o.find(x=>x.type==='move') || {type:'pass'};
      });
      MCG.setRoster([
        {name:'我', human:true, team:0},
        {name:'队友', human:false, team:0, diff:'normal'},
        {name:'敌人A', human:false, team:1, diff:'easy'},
        {name:'敌人B', human:false, team:1, diff:'hard'},
      ]);
      log(null, '开始完整跑一局 2v2（最多等 20s）…');
      MCG.start({silent:false, seed:2024});
      const t0 = Date.now();
      while(Date.now() - t0 < 20000){
        await sleep(120);
        const st = MCG.state();
        if(st && st.over) break;
      }
      G = MCG.state();
      const overlay = f.contentDocument.getElementById('overlayBox');
      const overlayText = overlay ? overlay.textContent : '';
      log(!!G.over, '整局能正常打完（无异常卡死）', {rounds:G.round, 用时:(Date.now()-t0)+'ms'});
      log(overlayText.includes('赢') || overlayText.includes('击败'), '结算面板出现', overlayText.slice(0,24));

      /* ---------- 8. PWA 资源 ---------- */
      const mf = await fetch('/manifest.webmanifest');
      const mfText = await mf.text();
      let mfJson = null;
      try{ mfJson = JSON.parse(mfText); }catch(e){}
      log(mf.ok && mfJson && mfJson.icons.length >= 2, 'manifest 可由服务器取到且是合法 JSON',
          {type: mf.headers.get('content-type'), icons: mfJson ? mfJson.icons.length : 0});
      log(!!mfJson && mfJson.display === 'standalone' && mfJson.start_url, 'manifest 有 standalone / start_url',
          {display: mfJson && mfJson.display, start: mfJson && mfJson.start_url});
      const sw = await fetch('/sw.js');
      log(sw.ok && (await sw.text()).includes("addEventListener('fetch'"), 'sw.js 可取到且含 fetch 处理');
      for(const ic of ['icon-192.png','icon-512.png','icon-maskable-512.png','apple-touch-icon-180.png']){
        const r2 = await fetch('/' + ic);
        log(r2.ok && (r2.headers.get('content-type')||'').includes('image/png'), '图标可用 ' + ic);
      }
      const link = f.contentDocument.querySelector('link[rel="manifest"]');
      log(!!link, '页面挂了 manifest 链接', link && link.getAttribute('href'));
      log('serviceWorker' in (f.contentWindow.navigator), '浏览器支持 Service Worker');
    }catch(err){
      log(false, '测试脚本异常：' + (err && err.message), err && err.stack ? String(err.stack).slice(0,200) : '');
    }
    finish();
  });
});
</script>
</body></html>
